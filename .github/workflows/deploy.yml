name: Initialize and publish academic homepage
on:
  push:
    branches: [main]
    paths: ['homepage-source.zip', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack approved source
        if: ${{ hashFiles('homepage-source.zip') != '' }}
        run: |
          echo '13db3ef9df8c4fb725a7ae6421ad6d86094117846c9425e7018e2fa9a9b07f01  homepage-source.zip' | sha256sum --check
          unzip -o homepage-source.zip -x '.github/*'
          rm homepage-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Publish academic homepage source with automatic Pages deployment'
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build static website
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
